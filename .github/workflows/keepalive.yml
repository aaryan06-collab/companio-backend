name: Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 5 https://companio-backend-0480.onrender.com/health
      - name: Hit /admin/status (warms the live DB)
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 5 https://companio-backend-0480.onrender.com/admin/status